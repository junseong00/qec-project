<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760">
  <defs>
    <style>
      .bg{fill:#fbfcfd}
      .title{font:700 34px Arial, sans-serif;fill:#172033}
      .subtitle{font:400 18px Arial, sans-serif;fill:#475569}
      .label{font:700 21px Arial, sans-serif;fill:#172033}
      .small{font:400 16px Arial, sans-serif;fill:#334155}
      .tiny{font:400 14px Arial, sans-serif;fill:#475569}
      .mono{font:700 15px Consolas, monospace;fill:#172033}
      .card{fill:#fff;stroke:#cbd5e1;stroke-width:2;rx:12}
      .done{fill:#e8f6ed;stroke:#237a45;stroke-width:3;rx:12}
      .impl{fill:#eef6ff;stroke:#2563b8;stroke-width:3;rx:12}
      .future{fill:#f3f4f6;stroke:#64748b;stroke-width:2.5;stroke-dasharray:8 6;rx:12}
      .warn{fill:#fff7ed;stroke:#c2641a;stroke-width:2.5;rx:12}
      .arrow{stroke:#334155;stroke-width:3;fill:none;marker-end:url(#arrow)}
      .badge-green{fill:#237a45}
      .badge-blue{fill:#2563b8}
      .badge-gray{fill:#64748b}
      .badge-orange{fill:#c2641a}
      .badge-text{font:700 13px Arial, sans-serif;fill:white}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155"/>
    </marker>
  </defs>

  <rect width="1400" height="760" class="bg"/>
  <text x="60" y="58" class="title">캡스톤 I 구현 및 FPGA 검증 범위</text>
  <text x="62" y="90" class="subtitle">QECCT Student d=3 전체 디코더 중 실제 Verilog RTL 구현 및 Vivado post-route 검증을 완료한 블록을 표시</text>

  <!-- Model input -->
  <rect x="70" y="170" width="185" height="120" class="card"/>
  <text x="105" y="208" class="label">입력</text>
  <text x="96" y="238" class="small">Surface Code d=3</text>
  <text x="105" y="264" class="small">syndrome 8 bit</text>

  <!-- noise estimator -->
  <rect x="330" y="135" width="270" height="190" class="done"/>
  <rect x="355" y="158" width="74" height="24" class="badge-green" rx="12"/>
  <text x="370" y="175" class="badge-text">완료</text>
  <text x="370" y="212" class="label">noise_estimator</text>
  <text x="370" y="242" class="small">FC(8→24) → GELU</text>
  <text x="370" y="266" class="small">→ FC(24→9) → Sigmoid</text>
  <text x="370" y="296" class="mono">noise_estimator_pipe.v</text>

  <!-- embedding -->
  <rect x="675" y="135" width="210" height="190" class="future"/>
  <rect x="700" y="158" width="92" height="24" class="badge-gray" rx="12"/>
  <text x="714" y="175" class="badge-text">후속</text>
  <text x="730" y="212" class="label">embedding</text>
  <text x="710" y="242" class="small">syndrome + noise</text>
  <text x="710" y="266" class="small">17 tokens × 32 dim</text>
  <text x="710" y="296" class="tiny">캡스톤 II 통합 대상</text>

  <!-- transformer -->
  <rect x="960" y="115" width="330" height="230" class="impl"/>
  <text x="1025" y="150" class="label">Transformer Block</text>
  <rect x="990" y="178" width="135" height="70" class="future"/>
  <text x="1012" y="207" class="small">masked</text>
  <text x="1012" y="229" class="small">attention</text>
  <rect x="1145" y="178" width="135" height="70" class="done"/>
  <rect x="1163" y="191" width="70" height="22" class="badge-green" rx="11"/>
  <text x="1177" y="207" class="badge-text">완료</text>
  <text x="1174" y="235" class="small">FFN pipe</text>
  <text x="1010" y="286" class="small">FFN: Linear(32→128) → GELU → Linear(128→32)</text>
  <text x="1045" y="318" class="mono">ffn_pipe.v</text>

  <!-- output -->
  <rect x="960" y="430" width="220" height="130" class="future"/>
  <text x="998" y="468" class="label">output block</text>
  <text x="995" y="500" class="small">projection / output FC</text>
  <text x="995" y="526" class="tiny">후속 구현 대상</text>

  <rect x="1230" y="430" width="210" height="130" class="card"/>
  <text x="1280" y="468" class="label">출력</text>
  <text x="1260" y="500" class="small">오류 위치 예측</text>
  <text x="1296" y="526" class="small">9 bit</text>

  <!-- arrows -->
  <path d="M255 230 H330" class="arrow"/>
  <path d="M600 230 H675" class="arrow"/>
  <path d="M885 230 H960" class="arrow"/>
  <path d="M1125 345 V430" class="arrow"/>
  <path d="M1180 495 H1230" class="arrow"/>

  <!-- verification summary -->
  <rect x="80" y="430" width="770" height="210" class="card"/>
  <text x="115" y="470" class="label">완료된 검증 결과</text>

  <rect x="115" y="500" width="215" height="100" class="done"/>
  <text x="142" y="533" class="small">xsim 기능 검증</text>
  <text x="142" y="560" class="small">bit-exact PASS</text>
  <text x="142" y="585" class="tiny">golden INT8 model 대비</text>

  <rect x="365" y="500" width="245" height="100" class="impl"/>
  <text x="392" y="533" class="small">Vivado OOC 구현</text>
  <text x="392" y="560" class="small">synth/place/route 완료</text>
  <text x="392" y="585" class="tiny">Zynq-7020, 100 MHz</text>

  <rect x="645" y="500" width="245" height="100" class="warn"/>
  <text x="675" y="533" class="small">보드 실측 아님</text>
  <text x="675" y="560" class="small">post-route 분석 결과</text>
  <text x="675" y="585" class="tiny">전력/실물 I/O는 후속 과제</text>

  <!-- numbers -->
  <rect x="80" y="665" width="1235" height="55" fill="#eef2ff" stroke="#4f46e5" stroke-width="2" rx="12"/>
  <text x="112" y="699" class="small">FFN post-route: LUT 4,477(8.42%) · FF 2,905(2.73%) · DSP 2(0.91%) · BRAM 0 · WNS +1.842 ns @ 100 MHz</text>
</svg>
