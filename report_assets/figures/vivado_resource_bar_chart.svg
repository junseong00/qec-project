<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <defs>
    <style>
      .bg { fill: #f7f9fb; }
      .panel { fill: #ffffff; stroke: #d8dee8; stroke-width: 2; }
      .title { font-family: Arial, 'Noto Sans KR', sans-serif; font-size: 32px; font-weight: 700; fill: #172033; }
      .subtitle { font-family: Arial, 'Noto Sans KR', sans-serif; font-size: 18px; fill: #526070; }
      .label { font-family: Arial, 'Noto Sans KR', sans-serif; font-size: 18px; font-weight: 700; fill: #1f2937; }
      .small { font-family: Arial, 'Noto Sans KR', sans-serif; font-size: 15px; fill: #526070; }
      .axis { stroke: #b7c0ce; stroke-width: 2; }
      .grid { stroke: #e5eaf1; stroke-width: 1; }
      .bar-noise { fill: #2f80ed; }
      .bar-ffn { fill: #10a37f; }
      .bar-zero { fill: #ccd5df; }
      .legend-text { font-family: Arial, 'Noto Sans KR', sans-serif; font-size: 16px; fill: #283241; }
      .value { font-family: Arial, 'Noto Sans KR', sans-serif; font-size: 15px; font-weight: 700; fill: #1f2937; }
      .badge { fill: #eef3f8; stroke: #d7e0ea; stroke-width: 1.5; }
      .badge-title { font-family: Arial, 'Noto Sans KR', sans-serif; font-size: 16px; font-weight: 700; fill: #172033; }
      .badge-text { font-family: Arial, 'Noto Sans KR', sans-serif; font-size: 14px; fill: #39465a; }
      .note { font-family: Arial, 'Noto Sans KR', sans-serif; font-size: 14px; fill: #5b6778; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="720"/>

  <text class="title" x="60" y="58">Vivado Post-route 자원 사용량 비교</text>
  <text class="subtitle" x="60" y="88">Zynq-7020(xc7z020clg400-1) 기준 OOC 합성 / Place &amp; Route 결과</text>

  <rect class="panel" x="52" y="122" width="780" height="470" rx="8"/>

  <g transform="translate(120 180)">
    <line class="axis" x1="0" y1="360" x2="660" y2="360"/>
    <line class="axis" x1="0" y1="0" x2="0" y2="360"/>

    <g>
      <line class="grid" x1="0" y1="360" x2="660" y2="360"/>
      <line class="grid" x1="0" y1="270" x2="660" y2="270"/>
      <line class="grid" x1="0" y1="180" x2="660" y2="180"/>
      <line class="grid" x1="0" y1="90" x2="660" y2="90"/>
      <line class="grid" x1="0" y1="0" x2="660" y2="0"/>
      <text class="small" x="-44" y="365">0%</text>
      <text class="small" x="-52" y="275">3%</text>
      <text class="small" x="-52" y="185">6%</text>
      <text class="small" x="-52" y="95">9%</text>
      <text class="small" x="-60" y="5">12%</text>
    </g>

    <!-- Scale: 12% = 360 px -->
    <!-- LUT -->
    <rect class="bar-noise" x="65" y="308.7" width="42" height="51.3" rx="4"/>
    <rect class="bar-ffn" x="112" y="107.4" width="42" height="252.6" rx="4"/>
    <text class="value" x="60" y="300">1.71%</text>
    <text class="value" x="108" y="98">8.42%</text>
    <text class="label" x="77" y="398">LUT</text>

    <!-- FF -->
    <rect class="bar-noise" x="215" y="350.4" width="42" height="9.6" rx="4"/>
    <rect class="bar-ffn" x="262" y="278.1" width="42" height="81.9" rx="4"/>
    <text class="value" x="208" y="344">0.32%</text>
    <text class="value" x="258" y="270">2.73%</text>
    <text class="label" x="232" y="398">FF</text>

    <!-- DSP -->
    <rect class="bar-noise" x="365" y="5.4" width="42" height="354.6" rx="4"/>
    <rect class="bar-ffn" x="412" y="332.7" width="42" height="27.3" rx="4"/>
    <text class="value" x="356" y="-6">11.82%</text>
    <text class="value" x="408" y="325">0.91%</text>
    <text class="label" x="373" y="398">DSP</text>

    <!-- BRAM -->
    <rect class="bar-zero" x="515" y="357" width="42" height="3" rx="2"/>
    <rect class="bar-zero" x="562" y="357" width="42" height="3" rx="2"/>
    <text class="value" x="516" y="348">0%</text>
    <text class="value" x="564" y="348">0%</text>
    <text class="label" x="512" y="398">BRAM</text>

    <text class="small" x="195" y="440">자원 사용률은 전체 Zynq-7020 가용 자원 대비 비율입니다.</text>
  </g>

  <g transform="translate(585 130)">
    <rect class="bar-noise" x="0" y="0" width="18" height="18" rx="3"/>
    <text class="legend-text" x="28" y="15">noise_estimator_pipe</text>
    <rect class="bar-ffn" x="0" y="30" width="18" height="18" rx="3"/>
    <text class="legend-text" x="28" y="45">ffn_pipe</text>
  </g>

  <g transform="translate(860 122)">
    <rect class="panel" x="0" y="0" width="300" height="470" rx="8"/>
    <text class="label" x="24" y="42">타이밍 요약</text>

    <rect class="badge" x="24" y="70" width="252" height="140" rx="8"/>
    <text class="badge-title" x="42" y="100">noise_estimator_pipe</text>
    <text class="badge-text" x="42" y="130">Fmax: 약 105.3 MHz</text>
    <text class="badge-text" x="42" y="156">지연시간: 약 0.46 us</text>
    <text class="badge-text" x="42" y="182">xsim bit-exact: PASS</text>

    <rect class="badge" x="24" y="236" width="252" height="152" rx="8"/>
    <text class="badge-title" x="42" y="266">ffn_pipe</text>
    <text class="badge-text" x="42" y="296">WNS @100 MHz: +1.842 ns</text>
    <text class="badge-text" x="42" y="322">추정 Fmax: 약 122.6 MHz</text>
    <text class="badge-text" x="42" y="348">지연시간: 약 2.69 us</text>
    <text class="badge-text" x="42" y="374">xsim bit-exact: PASS</text>

    <text class="note" x="24" y="424">주의: 실제 FPGA 보드 실측이 아니라</text>
    <text class="note" x="24" y="446">Vivado 디바이스 모델 기반</text>
    <text class="note" x="24" y="468">post-route 구현 검증 결과입니다.</text>
  </g>

  <text class="note" x="60" y="642">보고서 표현 권장: 핵심 RTL 블록에 대해 기능 시뮬레이션과 Vivado post-route 자원/타이밍 분석을 수행하였다.</text>
  <text class="note" x="60" y="668">전체 QECCT SoC 통합 및 보드 실측은 후속 과제로 분리한다.</text>
</svg>
