<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="720" viewBox="0 0 1320 720">
  <defs>
    <style>
      .bg{fill:#fbfcfd}
      .title{font:700 32px Arial, sans-serif;fill:#172033}
      .sub{font:400 17px Arial, sans-serif;fill:#475569}
      .label{font:700 19px Arial, sans-serif;fill:#172033}
      .small{font:400 15px Arial, sans-serif;fill:#334155}
      .tiny{font:400 13px Arial, sans-serif;fill:#475569}
      .folder{fill:#eef2ff;stroke:#4f46e5;stroke-width:2.5;rx:12}
      .rtl{fill:#e8f6ed;stroke:#237a45;stroke-width:2.5;rx:12}
      .tb{fill:#fff7ed;stroke:#c2641a;stroke-width:2.5;rx:12}
      .report{fill:#eef6ff;stroke:#2563b8;stroke-width:2.5;rx:12}
      .tool{fill:#f8fafc;stroke:#64748b;stroke-width:2.5;rx:12}
      .arrow{stroke:#334155;stroke-width:2.6;fill:none;marker-end:url(#arrow)}
      .dash{stroke:#64748b;stroke-width:2.3;fill:none;stroke-dasharray:7 5;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="1320" height="720" class="bg"/>
  <text x="60" y="58" class="title">RTL 모듈 구성도</text>
  <text x="62" y="88" class="sub">Python 생성 스크립트, Verilog RTL, testbench, Vivado report 사이의 산출물 관계</text>

  <rect x="70" y="135" width="230" height="135" class="folder"/>
  <text x="128" y="172" class="label">model/ data/</text>
  <text x="98" y="205" class="small">student_L3_faulty.pt</text>
  <text x="98" y="230" class="small">qecct_student_d3.onnx</text>
  <text x="98" y="255" class="small">fpga_test_vectors.npz</text>

  <rect x="380" y="125" width="250" height="155" class="tool"/>
  <text x="447" y="164" class="label">tools/</text>
  <text x="410" y="197" class="small">gen_noise_estimator.py</text>
  <text x="410" y="222" class="small">gen_ffn.py</text>
  <text x="410" y="247" class="small">probe_ffn.py</text>

  <rect x="720" y="95" width="275" height="110" class="rtl"/>
  <text x="793" y="132" class="label">RTL 소스</text>
  <text x="750" y="162" class="small">noise_estimator_pipe.v</text>
  <text x="750" y="186" class="small">ffn_pipe.v</text>

  <rect x="720" y="245" width="275" height="110" class="folder"/>
  <text x="786" y="282" class="label">Parameter</text>
  <text x="750" y="312" class="small">noise_estimator_params.vh</text>
  <text x="750" y="336" class="small">ffn_params.vh</text>

  <rect x="720" y="395" width="275" height="110" class="tb"/>
  <text x="788" y="432" class="label">Testbench</text>
  <text x="750" y="462" class="small">tb_noise_estimator.v</text>
  <text x="750" y="486" class="small">tb_ffn.v</text>

  <rect x="1080" y="135" width="230" height="135" class="report"/>
  <text x="1142" y="172" class="label">xsim</text>
  <text x="1110" y="205" class="small">bit-exact PASS</text>
  <text x="1110" y="230" class="small">golden model 비교</text>

  <rect x="1080" y="345" width="230" height="150" class="report"/>
  <text x="1135" y="382" class="label">Vivado</text>
  <text x="1110" y="415" class="small">synth/place/route</text>
  <text x="1110" y="440" class="small">utilization report</text>
  <text x="1110" y="465" class="small">timing report</text>

  <rect x="430" y="515" width="250" height="105" class="folder"/>
  <text x="500" y="552" class="label">golden/</text>
  <text x="460" y="582" class="small">golden_report.txt</text>
  <text x="460" y="606" class="small">golden_ffn_report.txt</text>

  <rect x="780" y="555" width="300" height="105" class="report"/>
  <text x="865" y="592" class="label">reports/</text>
  <text x="810" y="622" class="small">FPGA_SYNTH_REPORT.md</text>
  <text x="810" y="646" class="small">utilization/timing *.txt</text>

  <path d="M300 202 H380" class="arrow"/>
  <path d="M630 190 C690 150 690 150 720 150" class="arrow"/>
  <path d="M630 214 C690 290 690 290 720 300" class="arrow"/>
  <path d="M630 238 C670 545 390 545 430 565" class="dash"/>
  <path d="M995 150 H1080" class="arrow"/>
  <path d="M995 300 C1060 300 1060 420 1080 420" class="arrow"/>
  <path d="M995 450 H1080" class="arrow"/>
  <path d="M1195 495 C1195 655 1115 650 1080 620" class="arrow"/>
  <path d="M680 585 H780" class="arrow"/>

  <rect x="70" y="640" width="540" height="44" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" rx="10"/>
  <text x="95" y="668" class="tiny">요점: 생성 스크립트가 parameter/test vector를 만들고, RTL은 xsim과 Vivado 양쪽에서 검증됨.</text>
</svg>
