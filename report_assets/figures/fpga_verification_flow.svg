<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
  <defs>
    <style>
      .title{font:700 30px Arial, sans-serif;fill:#172033}
      .label{font:700 19px Arial, sans-serif;fill:#172033}
      .small{font:400 15px Arial, sans-serif;fill:#334155}
      .tag{font:700 14px Arial, sans-serif;fill:#ffffff}
      .box{fill:#ffffff;stroke:#25636a;stroke-width:3;rx:12}
      .green{fill:#e9f8ef;stroke:#287a44;stroke-width:3;rx:12}
      .orange{fill:#fff4e6;stroke:#b96b21;stroke-width:3;rx:12}
      .blue{fill:#edf5ff;stroke:#2b63b8;stroke-width:3;rx:12}
      .arrow{stroke:#334155;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="1200" height="520" fill="#fbfcfd"/>
  <text x="60" y="58" class="title">FPGA 검증 진행 절차</text>
  <text x="62" y="88" class="small">실물 보드 실측 전 단계: Verilog RTL 기능 검증 + Vivado 디바이스 모델 기반 합성/배치/배선</text>

  <rect x="60" y="150" width="170" height="115" class="box"/>
  <text x="88" y="185" class="label">PyTorch</text>
  <text x="85" y="214" class="small">QECCT Student</text>
  <text x="85" y="238" class="small">d=3 weights</text>

  <rect x="285" y="150" width="180" height="115" class="box"/>
  <text x="315" y="185" class="label">INT8 변환</text>
  <text x="314" y="214" class="small">golden integer</text>
  <text x="314" y="238" class="small">model 생성</text>

  <rect x="520" y="150" width="180" height="115" class="green"/>
  <text x="560" y="185" class="label">Verilog RTL</text>
  <text x="548" y="214" class="small">noise_estimator</text>
  <text x="568" y="238" class="small">ffn_pipe.v</text>

  <rect x="755" y="150" width="180" height="115" class="orange"/>
  <text x="809" y="185" class="label">xsim</text>
  <text x="790" y="214" class="small">bit-exact</text>
  <text x="790" y="238" class="small">기능 검증</text>

  <rect x="990" y="150" width="170" height="115" class="blue"/>
  <text x="1028" y="185" class="label">Vivado</text>
  <text x="1014" y="214" class="small">synth/place/route</text>
  <text x="1014" y="238" class="small">post-route report</text>

  <path d="M230 207 H285" class="arrow"/>
  <path d="M465 207 H520" class="arrow"/>
  <path d="M700 207 H755" class="arrow"/>
  <path d="M935 207 H990" class="arrow"/>

  <rect x="130" y="345" width="410" height="78" fill="#f1f5f9" stroke="#64748b" stroke-width="2" rx="10"/>
  <text x="160" y="378" class="label">기능 검증 결과</text>
  <text x="160" y="405" class="small">RTL 출력과 INT8 golden 출력이 byte 단위로 완전 일치</text>

  <rect x="650" y="345" width="410" height="78" fill="#f1f5f9" stroke="#64748b" stroke-width="2" rx="10"/>
  <text x="680" y="378" class="label">구현 검증 결과</text>
  <text x="680" y="405" class="small">LUT/FF/DSP/BRAM 사용량과 100 MHz timing closure 확인</text>

  <rect x="520" y="285" width="100" height="28" fill="#287a44" rx="14"/>
  <text x="546" y="305" class="tag">완료</text>
  <rect x="796" y="285" width="100" height="28" fill="#b96b21" rx="14"/>
  <text x="822" y="305" class="tag">완료</text>
  <rect x="1024" y="285" width="100" height="28" fill="#2b63b8" rx="14"/>
  <text x="1050" y="305" class="tag">완료</text>
</svg>
