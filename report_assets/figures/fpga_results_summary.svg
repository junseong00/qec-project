<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
  <defs>
    <style>
      .title{font:700 30px Arial, sans-serif;fill:#172033}
      .label{font:700 18px Arial, sans-serif;fill:#172033}
      .small{font:400 15px Arial, sans-serif;fill:#334155}
      .num{font:700 22px Arial, sans-serif;fill:#0f172a}
      .axis{stroke:#94a3b8;stroke-width:2}
      .bar1{fill:#287a44}
      .bar2{fill:#2b63b8}
      .bar3{fill:#b96b21}
      .card{fill:#ffffff;stroke:#cbd5e1;stroke-width:2;rx:12}
    </style>
  </defs>
  <rect width="1200" height="620" fill="#fbfcfd"/>
  <text x="60" y="58" class="title">FPGA post-route 결과 요약</text>
  <text x="62" y="88" class="small">Target: Zynq-7020 xc7z020clg400-1, Vivado 2024.2 OOC implementation</text>

  <rect x="70" y="130" width="500" height="400" class="card"/>
  <text x="110" y="170" class="label">noise_estimator 비교</text>
  <line x1="150" y1="475" x2="520" y2="475" class="axis"/>
  <line x1="150" y1="210" x2="150" y2="475" class="axis"/>
  <text x="108" y="480" class="small">0</text>
  <text x="94" y="394" class="small">2k</text>
  <text x="94" y="308" class="small">4k</text>
  <text x="94" y="222" class="small">6k</text>
  <rect x="220" y="333" width="70" height="142" class="bar3"/>
  <rect x="335" y="436" width="70" height="39" class="bar1"/>
  <text x="214" y="315" class="num">3,310</text>
  <text x="342" y="420" class="num">912</text>
  <text x="196" y="505" class="small">area-min</text>
  <text x="318" y="505" class="small">speed-opt</text>
  <text x="430" y="245" class="small">LUT 기준</text>
  <text x="430" y="275" class="small">speed-opt:</text>
  <text x="430" y="300" class="small">Fmax 105.3 MHz</text>
  <text x="430" y="325" class="small">Latency 0.46 us</text>

  <rect x="630" y="130" width="500" height="400" class="card"/>
  <text x="670" y="170" class="label">FFN pipe 결과</text>
  <rect x="675" y="220" width="390" height="42" fill="#e8f6ed" rx="8"/>
  <text x="700" y="248" class="small">Slice LUT</text>
  <text x="935" y="249" class="num">4,477</text>
  <rect x="675" y="278" width="390" height="42" fill="#edf5ff" rx="8"/>
  <text x="700" y="306" class="small">Slice FF</text>
  <text x="935" y="307" class="num">2,905</text>
  <rect x="675" y="336" width="390" height="42" fill="#fff4e6" rx="8"/>
  <text x="700" y="364" class="small">DSP48E1</text>
  <text x="982" y="365" class="num">2</text>
  <rect x="675" y="394" width="390" height="42" fill="#f1f5f9" rx="8"/>
  <text x="700" y="422" class="small">BRAM</text>
  <text x="982" y="423" class="num">0</text>
  <rect x="675" y="452" width="390" height="42" fill="#ecfeff" rx="8"/>
  <text x="700" y="480" class="small">WNS @ 100 MHz</text>
  <text x="918" y="481" class="num">+1.842 ns</text>

  <rect x="130" y="555" width="940" height="38" fill="#eef2ff" stroke="#4f46e5" stroke-width="2" rx="10"/>
  <text x="170" y="580" class="small">해석: 실물 보드 실측은 아니지만, Vivado post-route 기준으로 핵심 RTL 블록의 FPGA 구현 가능성과 timing margin을 확인함.</text>
</svg>
