<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="640" viewBox="0 0 1400 640">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#21446f"/>
    </marker>
    <style>
      .title{font:700 34px Arial, sans-serif; fill:#1d2633}
      .label{font:700 22px Arial, sans-serif; fill:#1d2633}
      .small{font:18px Arial, sans-serif; fill:#4b5563}
      .stage{fill:#f7f9fc; stroke:#9bb5d8; stroke-width:2.3; rx:16}
      .rom{fill:#fff8ec; stroke:#d9b666; stroke-width:2.3; rx:16}
      .mac{fill:#eef4ff; stroke:#5f86bf; stroke-width:2.3; rx:16}
      .lut{fill:#f4fbf7; stroke:#91c6a4; stroke-width:2.3; rx:16}
      .arrow{stroke:#21446f; stroke-width:3.5; marker-end:url(#arrow)}
    </style>
  </defs>
  <rect x="18" y="18" width="1364" height="604" rx="24" fill="#ffffff" stroke="#d8e0ea" stroke-width="2"/>
  <text x="50" y="65" class="title">Transformer FFN: 32-lane MAC Datapath Zoom</text>
  <text x="50" y="96" class="small">This view highlights the structure that makes ffn_pipe synthesizable.</text>

  <rect x="55" y="190" width="185" height="125" class="rom"/>
  <text x="85" y="238" class="label">Packed WROM</text>
  <text x="85" y="270" class="small">32 weights / cycle</text>

  <rect x="55" y="365" width="185" height="125" class="stage"/>
  <text x="85" y="413" class="label">Operands</text>
  <text x="85" y="445" class="small">xin or hq chunk</text>

  <line x1="240" y1="252" x2="320" y2="300" class="arrow"/>
  <line x1="240" y1="427" x2="320" y2="350" class="arrow"/>

  <rect x="335" y="250" width="195" height="145" class="mac"/>
  <text x="365" y="303" class="label">P1</text>
  <text x="365" y="333" class="small">32 parallel</text>
  <text x="365" y="358" class="small">8x8 products</text>

  <line x1="530" y1="322" x2="600" y2="322" class="arrow"/>
  <rect x="615" y="250" width="195" height="145" class="stage"/>
  <text x="645" y="303" class="label">P2-P4</text>
  <text x="645" y="333" class="small">adder tree</text>
  <text x="645" y="358" class="small">32 -> 8 -> 2 -> 1</text>

  <line x1="810" y1="322" x2="880" y2="322" class="arrow"/>
  <rect x="895" y="250" width="195" height="145" class="stage"/>
  <text x="925" y="303" class="label">P5</text>
  <text x="925" y="333" class="small">chunk</text>
  <text x="925" y="358" class="small">accumulation</text>

  <line x1="1090" y1="322" x2="1160" y2="322" class="arrow"/>
  <rect x="1175" y="250" width="175" height="145" class="mac"/>
  <text x="1205" y="303" class="label">P6-P8</text>
  <text x="1205" y="333" class="small">requant</text>
  <text x="1205" y="358" class="small">+ writeback</text>

  <rect x="620" y="470" width="420" height="80" class="lut"/>
  <text x="650" y="518" class="label">FC1: GELU LUT -> hq   |   FC2: yq -> out_flat</text>
  <path d="M1260 395 C1260 500 1090 510 1040 510" fill="none" class="arrow"/>

  <text x="55" y="585" class="small">Key message: FC2 reduces 128 inputs as four 32-lane chunks, avoiding a huge single-cycle 128-wide MAC.</text>
</svg>
