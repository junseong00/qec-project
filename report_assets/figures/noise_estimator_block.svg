<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
  <defs>
    <style>
      .bg{fill:#fbfcfd}
      .title{font:700 32px Arial, sans-serif;fill:#172033}
      .sub{font:400 17px Arial, sans-serif;fill:#475569}
      .label{font:700 20px Arial, sans-serif;fill:#172033}
      .small{font:400 16px Arial, sans-serif;fill:#334155}
      .tiny{font:400 14px Arial, sans-serif;fill:#475569}
      .box{fill:#ffffff;stroke:#2f5d62;stroke-width:3;rx:12}
      .lut{fill:#fef3c7;stroke:#b45309;stroke-width:3;rx:12}
      .done{fill:#e8f6ed;stroke:#237a45;stroke-width:3;rx:12}
      .arrow{stroke:#334155;stroke-width:3;fill:none;marker-end:url(#arrow)}
      .badge{fill:#237a45}
      .badgeText{font:700 13px Arial, sans-serif;fill:#fff}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="1200" height="520" class="bg"/>
  <text x="60" y="58" class="title">noise_estimator 블록 구조</text>
  <text x="62" y="88" class="sub">Surface Code d=3 syndrome 입력에서 초기 noise feature를 추정하는 INT8 FC 블록</text>

  <rect x="60" y="180" width="150" height="100" class="box"/>
  <text x="95" y="218" class="label">입력</text>
  <text x="83" y="248" class="small">syndrome</text>
  <text x="106" y="272" class="small">8 bit</text>

  <rect x="275" y="155" width="165" height="150" class="done"/>
  <rect x="300" y="174" width="70" height="24" class="badge" rx="12"/>
  <text x="314" y="191" class="badgeText">RTL</text>
  <text x="320" y="225" class="label">FC1</text>
  <text x="310" y="254" class="small">Linear</text>
  <text x="308" y="278" class="small">8 → 24</text>

  <rect x="505" y="180" width="150" height="100" class="lut"/>
  <text x="553" y="218" class="label">GELU</text>
  <text x="536" y="248" class="small">LUT 기반</text>

  <rect x="720" y="155" width="165" height="150" class="done"/>
  <rect x="745" y="174" width="70" height="24" class="badge" rx="12"/>
  <text x="759" y="191" class="badgeText">RTL</text>
  <text x="765" y="225" class="label">FC2</text>
  <text x="755" y="254" class="small">Linear</text>
  <text x="753" y="278" class="small">24 → 9</text>

  <rect x="950" y="180" width="150" height="100" class="lut"/>
  <text x="990" y="218" class="label">Sigmoid</text>
  <text x="981" y="248" class="small">LUT 기반</text>

  <rect x="955" y="340" width="150" height="78" class="box"/>
  <text x="992" y="372" class="label">출력</text>
  <text x="990" y="398" class="small">9 bytes</text>

  <path d="M210 230 H275" class="arrow"/>
  <path d="M440 230 H505" class="arrow"/>
  <path d="M655 230 H720" class="arrow"/>
  <path d="M885 230 H950" class="arrow"/>
  <path d="M1025 280 V340" class="arrow"/>

  <rect x="72" y="370" width="780" height="70" fill="#eef2ff" stroke="#4f46e5" stroke-width="2" rx="12"/>
  <text x="100" y="400" class="small">검증 결과: xsim bit-exact PASS, Vivado post-route 완료</text>
  <text x="100" y="425" class="tiny">speed-optimal: LUT 912, FF 340, DSP 26, BRAM 0, Fmax 105.3 MHz, latency 약 0.46 us</text>
</svg>
